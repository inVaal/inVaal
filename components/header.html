<!-- =========================================================
  InVaal [016] — Global Header

  File:
  ./components/header.html

  IMPORTANT:
  Navigation paths are handled by navigation.js.

  Do NOT use ../ paths here.

  navigation.js reads:

  data-site-link
  data-site-logo

  and converts them into the correct paths depending
  on the current page location.
========================================================= -->


<div class="container header-inner">


  <!-- =======================================================
    BRAND
  ======================================================== -->

<a
      class="site-logo"
      href="./index.html"
    >

      <img
        src="./assets/logos/inVaalTriangle_logo.png"
        alt="InVaal [016]"
        width="42"
        height="42"
      />

    <span>
      InVaal <strong>[016]</strong>
    </span>

  </a>


  <!-- =======================================================
    DESKTOP NAVIGATION
  ======================================================== -->

  <nav
    class="site-navigation"
    aria-label="Main navigation"
  >

    <a
      href="#"
      data-site-link="pages/news.html"
    >
      News
    </a>


    <a
      href="#"
      data-site-link="pages/businesses.html"
    >
      Businesses
    </a>


    <a
      href="#"
      data-site-link="pages/opportunities.html"
    >
      Opportunities
    </a>


    <a
      href="#"
      data-site-link="pages/creatives.html"
    >
      Creatives
    </a>


    <a
      href="#"
      data-site-link="pages/events.html"
    >
      Events
    </a>

  </nav>


  <!-- =======================================================
    HEADER ACTIONS
  ======================================================== -->

  <div class="header-actions">

    <a
      class="button button-primary header-business-button"
      href="#"
      data-site-link="pages/advertise.html"
    >
      Advertise
    </a>


    <!-- =====================================================
      MOBILE MENU TOGGLE
    ====================================================== -->

    <button
      id="mobile-menu-toggle"
      class="mobile-menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-navigation"
      aria-label="Open navigation menu"
    >

      <span aria-hidden="true">
        ☰
      </span>

      <span class="sr-only">
        Menu
      </span>

    </button>

  </div>

</div>


<!-- =========================================================
  MOBILE NAVIGATION
========================================================= -->

<nav
  id="mobile-navigation"
  class="mobile-navigation"
  aria-label="Mobile navigation"
  hidden
>

  <div class="mobile-navigation-inner">

    <a
      href="#"
      data-site-link="index.html"
    >
      Home
    </a>


    <a
      href="#"
      data-site-link="pages/news.html"
    >
      📰
      <span>News</span>
    </a>


    <a
      href="#"
      data-site-link="pages/businesses.html"
    >
      🏪
      <span>Businesses</span>
    </a>


    <a
      href="#"
      data-site-link="pages/opportunities.html"
    >
      💼
      <span>Opportunities</span>
    </a>


    <a
      href="#"
      data-site-link="pages/creatives.html"
    >
      🎨
      <span>Creatives</span>
    </a>


    <a
      href="#"
      data-site-link="pages/events.html"
    >
      📅
      <span>Events</span>
    </a>


    <a
      href="#"
      data-site-link="pages/contact.html"
    >
      🤝
      <span>Contact</span>
    </a>


    <!-- =====================================================
      MOBILE BUSINESS CTA
    ====================================================== -->

    <a
      class="button button-primary"
      href="#"
      data-site-link="pages/advertise.html"
    >
      Advertise with InVaal
    </a>

  </div>

</nav>
