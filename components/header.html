<!-- =========================================================
  InVaal [016] — Global Header

  ./components/header.html

  Responsibilities:
  - Display InVaal [016] branding
  - Provide desktop navigation
  - Provide mobile navigation
  - Provide a business/advertising CTA
  - Remain compatible with navigation.js

  IMPORTANT:
  Navigation paths are intentionally written using
  data attributes.

  navigation.js converts them into the correct paths
  depending on whether the current page is:

  /index.html

  or:

  /pages/example.html
========================================================= -->


<div class="container header-inner">


  <!-- =======================================================
    BRAND
  ======================================================== -->

  <a
    class="site-logo"
    href="../index.html"
    data-site-link="index.html"
    aria-label="InVaal [016] — Home"
  >

    <img
      src="/assets/logos/inVaalTriangle_logo.png"
      data-site-logo
      alt="InVaal [016] logo"
      width="42"
      height="42"
    />

    <span>
      InVaal <strong>[016]</strong>
    </span>

  </a>



  <!-- =======================================================
    DESKTOP NAVIGATION
  ======================================================== -->

  <nav
    class="site-navigation"
    aria-label="Main navigation"
  >


   

    <a
      href="#"
      data-site-link="pages/news.html"
    >
      News
    </a>


    <a
      href="#"
      data-site-link="pages/businesses.html"
    >
      Businesses
    </a>


    <a
      href="#"
      data-site-link="pages/opportunities.html"
    >
      Opportunities
    </a>


    <a
      href="#"
      data-site-link="pages/creatives.html"
    >
      Creatives
    </a>


    <a
      href="#"
      data-site-link="pages/events.html"
    >
      Events
    </a>

  </nav>



  <!-- =======================================================
    HEADER ACTIONS
  ======================================================== -->

  <div class="header-actions">


    <a
      class="button button-primary header-business-button"
      href="../pages/advertise.html"
      data-site-link="pages/advertise.html"
    >
      Advertise
    </a>



    <!-- =====================================================
      MOBILE MENU TOGGLE

      navigation.js looks specifically for:

      #mobile-menu-toggle
    ====================================================== -->

    <button
      id="mobile-menu-toggle"
      class="mobile-menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-navigation"
      aria-label="Open navigation menu"
    >

      <span aria-hidden="true">
        ☰
      </span>

      <span class="sr-only">
        
      </span>

    </button>

  </div>

</div>



<!-- =========================================================
  MOBILE NAVIGATION

  navigation.js looks specifically for:

  #mobile-navigation
========================================================= -->

<nav
  id="mobile-navigation"
  class="mobile-navigation"
  aria-label="Mobile navigation"
  hidden
>

  <div class="mobile-navigation-inner">


    <a
      href="#"
      data-site-link="index.html"
    >
      Home
    </a>


    <a
      href="#"
      data-site-link="pages/news.html"
    >
      📰
      <span>News</span>
    </a>


    <a
      href="#"
      data-site-link="pages/businesses.html"
    >
      🏪
      <span>Businesses</span>
    </a>


    <a
      href="#"
      data-site-link="pages/opportunities.html"
    >
      💼
      <span>Opportunities</span>
    </a>


    <a
      href="#"
      data-site-link="pages/creatives.html"
    >
      🎨
      <span>Creatives</span>
    </a>


    <a
      href="#"
      data-site-link="pages/events.html"
    >
      📅
      <span>Events</span>
    </a>


    <a
      href="#"
      data-site-link="pages/contact.html"
    >
      🤝
      <span>Contact</span>
    </a>



    <!-- =====================================================
      MOBILE BUSINESS CTA
    ====================================================== -->

    <a
      class="button button-primary"
      href="../pages/advertise.html"
      data-site-link="pages/advertise.html"
    >
      Advertise with InVaal
    </a>

  </div>

</nav>
