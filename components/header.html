<!-- =========================================================
  InVaal [016] — Global Header

  ./components/header.html

  Responsibilities:
  - Display InVaal [016] branding
  - Provide desktop navigation
  - Provide mobile navigation
  - Provide a business/advertising CTA
  - Remain compatible with navigation.js
========================================================= -->

<div class="container header-inner">

  <!-- =======================================================
    BRAND
  ======================================================== -->

  <a
    class="site-logo"
    href="./index.html"
    aria-label="InVaal [016] — Home"
  >

    <img
      src="./assets/logos/inVaalTriangle_logo.png"
      alt="InVaal [016] logo"
      width="42"
      height="42"
    />

    <span>
      InVaal <strong>[016]</strong>
    </span>

  </a>


  <!-- =======================================================
    DESKTOP NAVIGATION
  ======================================================== -->

  <nav
    class="site-navigation"
    aria-label="Main navigation"
  >

    <a href="./index.html">
      Home
    </a>

    <a href="./pages/news.html">
      News
    </a>

    <a href="./pages/businesses.html">
      Businesses
    </a>

    <a href="./pages/opportunities.html">
      Opportunities
    </a>

    <a href="./pages/creatives.html">
      Creatives
    </a>

    <a href="./pages/events.html">
      Events
    </a>

  </nav>


  <!-- =======================================================
    HEADER ACTIONS
  ======================================================== -->

  <div class="header-actions">

    <a
      class="button button-primary header-business-button"
      href="./pages/advertise.html"
    >
      Advertise
    </a>


    <!-- =====================================================
      MOBILE MENU TOGGLE

      navigation.js looks specifically for:

      #mobile-menu-toggle

      aria-expanded controls whether the menu is open.
    ====================================================== -->

    <button
      id="mobile-menu-toggle"
      class="mobile-menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-navigation"
      aria-label="Open navigation menu"
    >

      <span aria-hidden="true">
        ☰
      </span>

      <span class="sr-only">
        Menu
      </span>

    </button>

  </div>

</div>


<!-- =========================================================
  MOBILE NAVIGATION

  navigation.js looks specifically for:

  #mobile-navigation

  The menu starts hidden and is controlled through
  the mobile menu toggle.
========================================================= -->

<nav
  id="mobile-navigation"
  class="mobile-navigation"
  aria-label="Mobile navigation"
  hidden
>

  <div class="mobile-navigation-inner">

    <a href="./index.html">
      Home
    </a>

    <a href="./pages/news.html">
      📰
      <span>News</span>
    </a>

    <a href="./pages/businesses.html">
      🏪
      <span>Businesses</span>
    </a>

    <a href="./pages/opportunities.html">
      💼
      <span>Opportunities</span>
    </a>

    <a href="./pages/creatives.html">
      🎨
      <span>Creatives</span>
    </a>

    <a href="./pages/events.html">
      📅
      <span>Events</span>
    </a>

    <a href="./pages/contact.html">
      🤝
      <span>Contact</span>
    </a>


    <!-- Mobile business CTA -->

    <a
      class="button button-primary"
      href="./pages/advertise.html"
    >
      Advertise with InVaal
    </a>

  </div>

</nav>
