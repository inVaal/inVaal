<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Business information on InVaal [016]."
  />

  <title>
    Business | InVaal [016]
  </title>


  <!-- Global styles -->

  <link
    rel="stylesheet"
    href="../../css/root.css"
  />

  <link
    rel="stylesheet"
    href="../../css/typography.css"
  />

  <link
    rel="stylesheet"
    href="../../css/layout.css"
  />

  <link
    rel="stylesheet"
    href="../../css/components.css"
  />

  <link
    rel="stylesheet"
    href="../../css/responsive.css"
  />

</head>


<body>

  <!-- Accessibility -->

  <a
    class="skip-link"
    href="#main"
  >
    Skip to content
  </a>


  <!-- Global header -->

  <header
    id="site-header"
    class="site-header"
    role="banner"
  >
    <!-- Loaded by navigation.js -->
  </header>


  <main
    id="main"
    class="site-main"
  >


    <!-- =====================================================
      BUSINESS HERO
    ====================================================== -->

    <section
      class="business-hero section"
      aria-labelledby="business-title"
    >

      <div class="container">

        <a
          class="section-link"
          href="../businesses.html"
        >
          ← Back to businesses
        </a>


        <div
          id="business-profile"
          class="business-profile"
        >

          <!-- Business information injected here -->

          <p
            id="business-status"
            class="status-message"
            aria-live="polite"
          >
            Loading business...
          </p>

        </div>

      </div>

    </section>


    <!-- =====================================================
      BUSINESS CONTENT
    ====================================================== -->

    <section
      class="section"
      aria-labelledby="business-information-title"
    >

      <div class="container">

        <div
          id="business-content"
          class="business-content"
        >

          <!-- Business details injected by JavaScript -->

        </div>

      </div>

    </section>


  </main>


  <!-- Global footer -->

  <footer
    id="site-footer"
    class="site-footer"
    role="contentinfo"
  >
    <!-- Loaded by navigation.js -->
  </footer>


  <!-- Global navigation -->

  <script
    src="../../js/navigation.js"
    defer
  ></script>


  <!-- Business detail loader -->

  <script
    src="../../js/loaders/business-detail-loader.js"
    defer
  ></script>

</body>

</html>
